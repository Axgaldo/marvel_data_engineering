version: 2

sources:
  - name: marvel_raw
    description: "Capa de aterrizaje (Landing) con los JSON crudos de League of Comic Geeks."
    database: "{{ env_var('DBT_ENVIRONMENTS') }}_MARVEL_BRONZE_DB"
    schema: LANDING
    tables:
      - name: raw_comics
        description: "Tabla con los JSON de los issues. Incluye el nombre del archivo original para auditoría."
        columns:
          - name: json_data
          - name: file_name
          - name: ingested_at

      - name: raw_characters
        description: "Tabla con los JSON de los personajes. Incluye el nombre del archivo original."
        columns:
          - name: json_data
          - name: file_name
          - name: ingested_at

      - name: raw_release_dates
        description: "Tabla cargada desde el archivo JSONL con las fechas de lanzamiento y series."
        columns:
          - name: json_data
          - name: ingested_at
          
      - name: raw_series  
        description: "Índice maestro de colecciones/series de Marvel"
        columns:
          - name: json_data
          - name: ingested_at