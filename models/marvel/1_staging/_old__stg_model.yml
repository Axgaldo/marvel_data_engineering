version: 2

models:
  # ==========================================
  # ARTISTS & ROLES
  # ==========================================
  - name: stg_artists
    description: "Maestro de artistas y creadores únicos (escritores, dibujantes, etc.)."
    columns:
      - name: artist_id
        description: "PK generada por hash basada en el nombre."
        data_tests:
          - unique
          - not_null
      - name: artist_name
        description: "Nombre completo del creador en UPPERCASE."

  - name: stg_roles
    description: "Diccionario de roles creativos para normalización."
    columns:
      - name: role_id
        data_tests:
          - unique
          - not_null
      - name: role_name
        description: "Ej: WRITER, ARTIST, COLORIST, LETTERER."

  # ==========================================
  # CHARACTERS
  # ==========================================
  - name: stg_characters
    description: "Tabla principal de personajes (dimensión character)."
    columns:
      - name: character_id
        data_tests:
          - unique
          - not_null
      - name: character_name
        description: "Nombre del personaje o alter-ego."
      - name: real_name
        description: "Nombre real del personaje si aplica."
      - name: character_url
        description: "URL de la ficha del personaje."
      - name: character_type
        description: "Tipo de entrada (Alter-Ego, Persona, etc.)."
      - name: franchise_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_franchises')
                field: franchise_id
      - name: universe_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_multiversal_entities')
                field: multiversal_entity_id
      - name: pronouns_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pronouns')
                field: pronouns_id
      - name: multiversal_entity_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_multiversal_entities')
                field: multiversal_entity_id
      - name: biography_text
        description: "Texto descriptivo de la biografía."
      - name: living_status
        description: "Estado vital estandarizado."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ALIVE', 'DEAD', 'UNDEAD']
                quote: true
      - name: is_alive
        description: "Booleano derivado de living_status."
      - name: active_since_year
        description: "Año de la primera aparición."
      - name: active_until_year
        description: "Año de desaparición (NULL si sigue activo)."
      - name: loaded_at
        description: "Timestamp de ingesta de datos."

  - name: stg_character_species
    description: "Tabla bridge: relaciona personajes con sus múltiples especies."
    columns:
      - name: character_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: species_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_species')
                field: species_id

  - name: stg_species
    columns:
      - name: species_id
        data_tests:
          - unique
          - not_null
      - name: species_name

  - name: stg_pronouns
    columns:
      - name: pronouns_id
        data_tests:
          - unique
          - not_null

  - name: stg_multiversal_entities
    columns:
      - name: multiversal_entity_id
        data_tests:
          - unique
          - not_null
      - name: multiversal_entity_name

  - name: stg_franchises
    columns:
      - name: franchise_id
        data_tests:
          - unique
          - not_null
      - name: franchise_name

  # ==========================================
  # TEAMS & RELATIONSHIPS
  # ==========================================
  - name: stg_teams
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null
      - name: team_name
        data_tests:
          - not_null

  - name: stg_character_affiliations
    columns:
      - name: character_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_id
      - name: is_current
        description: "Indica si el personaje es miembro actual del equipo."
        data_tests:
          - not_null

  - name: stg_character_creators
    columns:
      - name: character_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: artist_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_artists')
                field: artist_id

  - name: stg_character_relationships
    columns:
      - name: character_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: related_character_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: relationship_type

  # ==========================================
  # ISSUES & SERIES
  # ==========================================
  - name: stg_series
    columns:
      - name: series_id
        data_tests:
          - unique
          - not_null
      - name: series_title
      - name: start_year
      - name: end_year
      - name: total_issues_expected
      - name: series_url

  - name: stg_formats
    columns:
      - name: format_id
        data_tests:
          - unique
          - not_null

  - name: stg_issues
    columns:
      - name: issue_id
        data_tests:
          - unique
          - not_null
      - name: series_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_series')
                field: series_id
      - name: issue_title
      - name: issue_url
      - name: release_date_raw
      - name: format_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_formats')
                field: format_id
      - name: price_dollars
      - name: num_pages
      - name: rating_avg
      - name: ratings_count
      - name: upc
      - name: cover_url

  # ==========================================
  # STORIES & BRIDGES
  # ==========================================
  - name: stg_stories
    columns:
      - name: story_id
        data_tests:
          - unique
          - not_null
      - name: issue_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_issues')
                field: issue_id
      - name: story_index
      - name: story_title

  - name: stg_story_characters
    columns:
      - name: story_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stories')
                field: story_id
      - name: character_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: appearance_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Main', 'Supporting', 'Cameo']

  - name: stg_story_artists
    columns:
      - name: story_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stories')
                field: story_id
      - name: artist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_artists')
                field: artist_id
      - name: role_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_roles')
                field: role_id