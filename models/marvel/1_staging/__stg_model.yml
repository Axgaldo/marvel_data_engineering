version: 2

models:
  # ==========================================
  # ARTISTS
  # ==========================================
  - name: stg_artists
    description: "Maestro de artistas (creadores)."
    columns:
      - name: artist_id
        description: "PK generada por hash."
        data_tests:
          - unique
          - not_null
      - name: artist_name
        description: "Nombre del creador."

  - name: stg_roles
    description: "Diccionario de roles creativos."
    columns:
      - name: role_id
        data_tests:
          - unique
          - not_null
      - name: role_name
        description: "Ej: Writer, Penciller, Inker."

  # ==========================================
  # CHARACTERS
  # ==========================================
  - name: stg_characters
    columns:
      - name: character_id
        data_tests:
          - unique
          - not_null
      - name: character_name
      - name: real_name
      - name: character_url
      - name: species_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_character_species')
                field: species_id
      - name: pronouns_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pronouns')
                field: pronouns_id
      - name: multiversal_entity_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_multiversal_entities')
                field: multiversal_entity_id
      - name: biography_text
      - name: loaded_at

  - name: stg_character_species
    columns:
      - name: species_id
        data_tests:
          - unique
          - not_null
      - name: species_name

  - name: stg_pronouns
    columns:
      - name: pronouns_id
        data_tests:
          - unique
          - not_null

  - name: stg_multiversal_entities
    columns:
      - name: multiversal_entity_id
        data_tests:
          - unique
          - not_null
      - name: multiversal_entity_name

  - name: stg_capabilities
    columns:
      - name: capability_id
        data_tests:
          - unique
          - not_null
      - name: capability_name

  - name: stg_character_capabilities
    columns:
      - name: character_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: capability_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_capabilities')
                field: capability_id

  - name: stg_character_affiliations
    columns:
      - name: character_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: team_id
        data_tests:
          - not_null
      - name: team_name
      - name: affiliation_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['FORMER', 'CURRENT', 'UNKNOWN']
      - name: team_url

  - name: stg_character_creators
    columns:
      - name: character_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: artist_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_artists')
                field: artist_id

  - name: stg_character_relationships
    columns:
      - name: character_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: related_character_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_characters')
                field: character_id
      - name: relationship_type

  # ==========================================
  # ISSUES
  # ==========================================
  - name: stg_series
    columns:
      - name: series_id
        data_tests:
          - unique
          - not_null
      - name: series_title
      - name: start_year
      - name: end_year
      - name: total_issues_expected
      - name: series_url

  - name: stg_issues
    columns:
      - name: issue_id
        data_tests:
          - unique
          - not_null
      - name: series_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_series')
                field: series_id
      - name: issue_title
      - name: issue_url
      - name: release_date_raw
      - name: format_desc
      - name: price_dollars
      - name: num_pages
      - name: rating_avg
      - name: ratings_count
      - name: upc
      - name: cover_url

  - name: stg_stories
    columns:
      - name: story_id
        data_tests:
          - unique
          - not_null
      - name: issue_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_issues')
                field: issue_id
      - name: story_index
      - name: story_title
      - name: story_type

  - name: stg_story_artists
    columns:
      - name: story_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stories')
                field: story_id
      - name: artist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_artists')
                field: artist_id
      - name: role_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_roles')
                field: role_id